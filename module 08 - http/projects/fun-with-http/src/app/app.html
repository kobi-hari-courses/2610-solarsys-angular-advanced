<button (click)="getAllUsers()">Get all users</button>
@if (isBusy()) {
  <p>Loading...</p>
}

@for (user of users(); track user.id) {
  <div class="user">
    <p>{{ user.name }}</p>
    <p>{{ user.email }}</p>
    <button (click)="deleteUser(user.id)">Delete</button>
  </div>
} @empty {
  <div class="empty">
    <p>No users found.</p>
  </div>
}

<div class="form">
  <label>
    Name:
    <input type="text" #nameInput>
  </label>
  <label>
    Email:
    <input type="email" #emailInput>
  </label>
  <button (click)="addNewUser(nameInput.value, emailInput.value)">Add User</button>
</div>
