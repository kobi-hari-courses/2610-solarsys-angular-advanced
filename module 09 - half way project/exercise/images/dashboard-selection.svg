      <text x="950" y="412" text-anchor="end">61.6</text>
      <text x="1048" y="412" text-anchor="end" font-weight="700" fill="#16847f">5.5</text>
      <text x="630" y="446">Jun 2, 2026</text>
      <text x="830" y="446" text-anchor="end">10.8</text>
      <text x="950" y="446" text-anchor="end">58.3</text>
      <text x="1048" y="446" text-anchor="end" font-weight="700" fill="#16847f">5.4</text>
      <text x="630" y="480">Aug 21, 2026</text>
      <text x="830" y="480" text-anchor="end">11.5</text>
      <text x="950" y="480" text-anchor="end">59.8</text>
      <text x="1048" y="480" text-anchor="end" font-weight="700" fill="#16847f">5.2</text>
      <text x="630" y="514">Jul 3, 2026</text>
      <text x="830" y="514" text-anchor="end">10.1</text>
      <text x="950" y="514" text-anchor="end">51.5</text>
      <text x="1048" y="514" text-anchor="end" font-weight="700" fill="#16847f">5.1</text>
      <text x="630" y="548">May 19, 2026</text>
