<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Solar Dashboard page with the company picker and sites sidebar marked</title>
  <desc id="desc">The complete dashboard page. Green outlines mark the company picker in the header and the sites sidebar grouped by region.</desc>
  <rect width="1100" height="620" fill="#fff"/>
