    <text x="540" y="541">Member discount</text><text x="940" y="541" text-anchor="end" fill="#16847f">−$4.60</text>
    <text x="540" y="569">Shipping</text><text x="940" y="569" text-anchor="end" fill="#25313c">$4.00</text>
    <text x="540" y="597">Coupon</text><text x="940" y="597" text-anchor="end" fill="#16847f">−$3.00</text>
    <path d="M540 610H940" stroke="#dfe5e8"/>
    <text x="540" y="638" font-size="17" font-weight="700" fill="#25313c">Total</text><text x="940" y="638" text-anchor="end" font-size="17" font-weight="700" fill="#25313c">$42.40</text>
