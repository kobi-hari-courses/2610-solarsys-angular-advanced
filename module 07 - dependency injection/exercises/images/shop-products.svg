<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Mini Shop single-page layout with catalog highlighted</title>
  <desc id="desc">The complete shop page: text-only product catalog on the left, cart above checkout summary on the right.</desc>
  <rect width="1000" height="760" fill="#fff"/>
  <path d="M0 82H1000" stroke="#e5e9ec"/>
  <text x="40" y="52" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#25313c">Mini Shop</text>
  <text x="40" y="119" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#25313c">Product catalog</text>
  <rect x="40" y="137" width="190" height="36" rx="5" fill="#fff" stroke="#cfd8dd"/>
  <text x="54" y="161" font-family="Arial, sans-serif" font-size="14" fill="#36434d">All categories</text>
  <path d="m207 151 6 6 6-6" fill="none" stroke="#52616d" stroke-width="2"/>
  <rect x="32" y="104" width="456" height="567" rx="8" fill="none" stroke="#16847f" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
