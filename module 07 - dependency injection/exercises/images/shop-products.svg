    <rect x="40" y="287" width="440" height="88" rx="6" fill="#fff" stroke="#d7dfe3"/>
    <text x="58" y="318" font-size="17" font-weight="700" fill="#25313c">Pocket Notebook</text>
    <text x="58" y="344" font-size="14" fill="#6a7781">Stationery</text>
    <text x="279" y="332" font-size="16" font-weight="700" fill="#25313c">$8.00</text>
    <rect x="355" y="311" width="108" height="36" rx="5" fill="#16847f"/>
    <text x="369" y="334" font-size="13" font-weight="700" fill="#fff">Add to cart</text>
    <rect x="40" y="387" width="440" height="88" rx="6" fill="#fff" stroke="#d7dfe3"/>
    <text x="58" y="418" font-size="17" font-weight="700" fill="#25313c">Desk Plant</text>
    <text x="58" y="444" font-size="14" fill="#6a7781">Home &amp; Office</text>
    <text x="279" y="432" font-size="16" font-weight="700" fill="#25313c">$18.00</text>
    <rect x="355" y="411" width="108" height="36" rx="5" fill="#16847f"/>
