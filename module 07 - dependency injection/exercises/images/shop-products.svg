  </g>
  <text x="520" y="119" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#25313c">Cart <tspan font-size="15" font-weight="400" fill="#6a7781">(4 items)</tspan></text>
  <rect x="520" y="137" width="440" height="290" rx="8" fill="#fff" stroke="#d7dfe3"/>
  <g font-family="Arial, sans-serif">
