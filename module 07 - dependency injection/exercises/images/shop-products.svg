    <text x="540" y="266" font-size="14" fill="#25313c">Pocket Notebook</text><text x="770" y="266" font-size="14" fill="#25313c">$16.00</text>
    <text x="540" y="325" font-size="14" fill="#25313c">Desk Plant</text><text x="770" y="325" font-size="14" fill="#25313c">$18.00</text>
    <g fill="#f2f5f6"><rect x="670" y="188" width="24" height="28" rx="3"/><rect x="694" y="188" width="30" height="28" fill="#fff" stroke="#cfd8dd"/><rect x="724" y="188" width="24" height="28" rx="3"/><rect x="670" y="247" width="24" height="28" rx="3"/><rect x="694" y="247" width="30" height="28" fill="#fff" stroke="#cfd8dd"/><rect x="724" y="247" width="24" height="28" rx="3"/><rect x="670" y="306" width="24" height="28" rx="3"/><rect x="694" y="306" width="30" height="28" fill="#fff" stroke="#cfd8dd"/><rect x="724" y="306" width="24" height="28" rx="3"/></g>
    <g fill="#34434d" font-size="13" text-anchor="middle"><text x="682" y="207">−</text><text x="709" y="207">1</text><text x="736" y="207">+</text><text x="682" y="266">−</text><text x="709" y="266">2</text><text x="736" y="266">+</text><text x="682" y="325">−</text><text x="709" y="325">1</text><text x="736" y="325">+</text></g>
    <text x="882" y="207" font-size="12" fill="#16847f">Remove</text><text x="882" y="266" font-size="12" fill="#16847f">Remove</text><text x="882" y="325" font-size="12" fill="#16847f">Remove</text>
    <text x="770" y="397" font-size="14" fill="#52616d">Subtotal</text><text x="905" y="397" text-anchor="end" font-size="16" font-weight="700" fill="#25313c">$46.00</text>
  </g>
  <text x="520" y="466" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#25313c">Checkout summary</text>
  <rect x="520" y="484" width="440" height="187" rx="8" fill="#fff" stroke="#d7dfe3"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#34434d">
